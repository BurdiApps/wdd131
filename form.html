<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Are We Doing? | WDD 131</title>
    <meta name="description" content="Submit a product review for our quality products">
    <meta name="author" content="James Burdick">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
</head>

<body>
    <header>
        <h1><strong>¯\_(ツ)_/¯</strong><br>How did we do?</h1>
        <p>What do you think of English Verb Learner?</p>
    </header>

    <main>
        <form id="review-form" action="review.html" method="get">
            <fieldset>
                <legend>Product Information</legend>

                <label for="product-name">Product Name: <span class="required" aria-label="required">*</span></label>
                <select id="product-name" name="product-name" required>
                    <option value="" disabled selected>Select a Product...</option>
                    <!-- Options will be populated by JavaScript -->
                </select>

                <label for="overall-rating">Overall Rating: <span class="required"
                    aria-label="required">*</span></label>
                <div class="rating-options">
                    <label class="radio-label">
                        <input type="radio" id="rating-1" name="overall-rating" value="1" required>
                        <span>★☆☆☆☆</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" id="rating-2" name="overall-rating" value="2">
                        <span>★★☆☆☆</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" id="rating-3" name="overall-rating" value="3">
                        <span>★★★☆☆</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" id="rating-4" name="overall-rating" value="4">
                        <span>★★★★☆</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" id="rating-5" name="overall-rating" value="5">
                        <span>★★★★★</span>
                    </label>
                </div>

                <label for="review-date">Date of Review: <span class="required" aria-label="required">*</span></label>
                <input type="date" id="review-date" name="review-date" required>
            </fieldset>

            <fieldset>
                <legend>Product Features</legend>

                <p class="field-description">Which features do you use? (Check all that apply)</p>
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="feature-audio" name="features" value="audio">
                        <span>Audio Pronunciation</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="feature-progress" name="features" value="progress">
                        <span>Progress Tracking</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="feature-bookmarks" name="features" value="bookmarks">
                        <span>Bookmarks/Favorites</span>
                    </label>
                    <label class="checkbox-label">
                        <input type="checkbox" id="feature-streaks" name="features" value="streaks">
                        <span>Study Streaks</span>
                    </label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Additional Feedback</legend>

                <label for="written-review">Written Review:</label>
                <textarea id="written-review" name="written-review" rows="5"
                    placeholder="Share your thoughts about this product..." maxlength="1000"></textarea>

                <label for="user-name">Your Name:</label>
                <input type="text" id="user-name" name="user-name" placeholder="Enter your name" autocomplete="name">
            </fieldset>

            <div class="form-actions">
                <button type="submit">Submit Review</button>
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> James Burdick | BurdiApps</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

    <script src="scripts/form.js"></script>
</body>

</html>
