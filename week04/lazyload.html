<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lazy Loading Images</title>
    <meta name="description" content="Demonstration of native lazy loading for images using the loading attribute">
    <meta name="author" content="Your Name">
    <link rel="stylesheet" href="styles/lazyload.css">
</head>

<body>
    <main>
        <h1>Image Lazy Loading Demonstration</h1>

        <img src="https://placehold.co/400x600/3498db/ffffff?text=Image+1" alt="A cute gray kitten with bright eyes"
            loading="lazy" width="400" height="600">

        <img src="https://placehold.co/400x600/e74c3c/ffffff?text=Image+2" alt="An orange tabby kitten playing"
            loading="lazy" width="400" height="600">

        <img src="https://placehold.co/400x600/2ecc71/ffffff?text=Image+3" alt="A fluffy white kitten looking curious"
            loading="lazy" width="400" height="600">

        <img src="https://placehold.co/400x600/f39c12/ffffff?text=Image+4"
            alt="A black and white kitten sitting peacefully" loading="lazy" width="400" height="600">

        <img src="https://placehold.co/400x600/9b59b6/ffffff?text=Image+5" alt="A striped kitten exploring outdoors"
            loading="lazy" width="400" height="600">

        <img src="https://placehold.co/400x600/1abc9c/ffffff?text=Image+6" alt="A sleepy kitten resting comfortably"
            loading="lazy" width="400" height="600">
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Lazy Loading Activity | WDD 131</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>

    <script src="scripts/lazyload.js"></script>
</body>

</html>
