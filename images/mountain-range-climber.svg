<svg width="1920" height="800" viewBox="0 0 1920 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Sky gradient background -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:1" />
    </linearGradient>
    
    <!-- Mountain gradients - progressively darker as they get closer -->
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A0AEC0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#718096;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#718096;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A5568;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mountain3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A5568;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2D3748;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="mountain4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2D3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A202C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky background -->
  <rect width="1920" height="800" fill="url(#skyGradient)"/>

  <!-- MM logo in top-left corner -->
  <g id="mm-logo" transform="translate(24,24)">
    <rect x="-8" y="-8" width="176" height="96" fill="rgba(255,255,255,0.0)"/>
    <image href="../project/images/math-mountain-logo.svg" x="0" y="0" width="160" height="80" />
  </g>
  
  <!-- Mountain Range - smallest in back (left), progressively larger to front (right) -->
  
  <!-- Back mountain layer 1 - smallest, far left -->
  <polygon points="0,800 150,550 300,800" fill="url(#mountain1)"/>
  <polygon points="200,800 400,500 600,800" fill="url(#mountain1)"/>
  
  <!-- Mountain layer 2 - medium small -->
  <polygon points="400,800 650,400 900,800" fill="url(#mountain2)"/>
  <polygon points="750,800 1000,450 1250,800" fill="url(#mountain2)"/>
  
  <!-- Mountain layer 3 - medium large -->
  <polygon points="900,800 1200,280 1500,800" fill="url(#mountain3)"/>
  
  <!-- Front mountain layer 4 - LARGEST, closest (right side) -->
  <polygon points="1200,800 1600,120 2000,800" fill="url(#mountain4)"/>
  
  <!-- Geometric climber on the largest mountain -->
  <!-- Position: climbing up the right face of the tallest mountain -->
  
  <!-- Climber body made of simple shapes -->
  <g id="climber" transform="translate(1720, 380)">
    <!-- Head - circle -->
    <circle cx="0" cy="0" r="12" fill="#F59E0B"/>
    
    <!-- Body - rectangle -->
    <rect x="-6" y="12" width="12" height="30" fill="#1E3A8A"/>
    
    <!-- Left arm (reaching up) - rectangle -->
    <rect x="-18" y="12" width="12" height="4" fill="#60A5FA" transform="rotate(-45 -12 14)"/>
    
    <!-- Right arm (holding) - rectangle -->
    <rect x="6" y="18" width="12" height="4" fill="#60A5FA" transform="rotate(30 12 20)"/>
    
    <!-- Left leg - rectangle -->
    <rect x="-10" y="42" width="8" height="20" fill="#1E3A8A" transform="rotate(-20 -6 42)"/>
    
    <!-- Right leg (stepping up) - rectangle -->
    <rect x="2" y="42" width="8" height="20" fill="#1E3A8A" transform="rotate(25 6 42)"/>
    
    <!-- Backpack - small rectangle -->
    <rect x="-8" y="16" width="16" height="14" fill="#F59E0B" opacity="0.8"/>
  </g>
  
  <!-- Optional: climbing rope -->
  <line x1="1720" y1="380" x2="1680" y2="320" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5,3"/>
  
</svg>
